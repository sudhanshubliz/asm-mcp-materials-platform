name: Deployment smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed backend URL
        required: false
        default: https://asm-mcp-materials-platform.onrender.com
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deployed backend
        env:
          DEPLOYMENT_BASE_URL: ${{ inputs.base_url || 'https://asm-mcp-materials-platform.onrender.com' }}
        run: python scripts/smoke_deployment.py --base-url "$DEPLOYMENT_BASE_URL"
